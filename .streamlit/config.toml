[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Taille max d'un fichier uploadé, appliquée côté serveur (Mo).
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = true

[client]
# Aucun détail technique (traces, chemins, URL) affiché aux utilisateurs.
showErrorDetails = "none"
